<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡易局マップ｜防災情報システム</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b2a;--cyan:#00acc1;--gray:#78909c;
  --panel:rgba(10,20,35,0.97);--border:rgba(0,172,193,0.22);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans JP',sans-serif;background:var(--navy);}

/* ── HEADER ── */
header{
  position:fixed;top:0;left:0;right:0;height:52px;
  display:flex;align-items:center;gap:10px;padding:0 16px;
  background:rgba(8,16,28,0.97);border-bottom:1px solid var(--border);
  z-index:1000;
}
#menuBtn{
  display:none;background:rgba(0,172,193,.15);
  border:1px solid rgba(0,172,193,.4);border-radius:7px;
  width:34px;height:34px;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;font-size:16px;color:var(--cyan);
}
.logo{width:32px;height:32px;background:var(--cyan);border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.htitle{font-size:14px;font-weight:700;color:#fff;letter-spacing:.04em;}
.hsub{font-size:10px;color:var(--gray);}
.hbadge{
  margin-left:auto;background:rgba(0,172,193,.13);
  border:1px solid var(--cyan);color:var(--cyan);
  font-size:11px;padding:3px 10px;border-radius:20px;
  font-family:'Inter',sans-serif;font-weight:600;white-space:nowrap;
}

/* ── LAYOUT ── */
.layout{display:flex;height:100%;padding-top:52px;}

/* ── SIDEBAR ── */
.sidebar{
  width:300px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;z-index:900;
}
.sb-search{padding:12px 14px 8px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:8px;align-items:center;}
.sb-search input{
  flex:1;background:rgba(255,255,255,.07);
  border:1px solid rgba(0,172,193,.28);border-radius:8px;
  padding:8px 12px;color:#fff;font-family:'Noto Sans JP',sans-serif;
  font-size:12px;outline:none;transition:border .2s;
}
.sb-search input:focus{border-color:var(--cyan);}
.sb-search input::placeholder{color:var(--gray);}
#sbCloseBtn{
  display:none;flex-shrink:0;background:none;
  border:1px solid rgba(255,255,255,.15);border-radius:6px;
  color:var(--gray);font-size:16px;padding:4px 8px;cursor:pointer;
}
.sb-list{flex:1;overflow-y:auto;padding:4px 0;}
.sb-list::-webkit-scrollbar{width:3px;}
.sb-list::-webkit-scrollbar-thumb{background:rgba(0,172,193,.3);border-radius:2px;}
.sb-item{padding:8px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;}
.sb-item:hover{background:rgba(0,172,193,.07);border-left-color:var(--cyan);}
.sb-item.active{background:rgba(0,172,193,.13);border-left-color:var(--cyan);}
.iname{font-size:12px;font-weight:500;color:#fff;}
.iaddr{font-size:10px;color:var(--gray);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-empty{padding:24px 14px;color:var(--gray);font-size:12px;text-align:center;}

/* ── MAP ── */
.map-wrap{flex:1;position:relative;overflow:hidden;}
#map{width:100%;height:100%;}

/* ── HAZARD PANEL ── */
.hazard-panel{
  position:absolute;top:14px;right:14px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:12px 13px;z-index:800;
  min-width:188px;box-shadow:0 4px 24px rgba(0,0,0,.4);
}
.hazard-panel h3{font-size:10px;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px;font-weight:600;}
.hbtn{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 10px;margin-bottom:5px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:7px;color:#fff;font-family:'Noto Sans JP',sans-serif;
  font-size:12px;cursor:pointer;transition:all .18s;text-align:left;
}
.hbtn:last-child{margin-bottom:0;}
.hbtn:hover{background:rgba(0,172,193,.12);border-color:var(--cyan);}
.hbtn.active{background:rgba(0,172,193,.22);border-color:var(--cyan);color:var(--cyan);}

/* ── INFO CARD ── */
.info-card{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--cyan);
  border-radius:14px;padding:16px 18px 14px;
  min-width:270px;max-width:420px;z-index:800;
  box-shadow:0 8px 40px rgba(0,172,193,.18);
  display:none;animation:slideUp .22s ease;
}
.info-card.show{display:block;}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.card-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--gray);cursor:pointer;font-size:18px;}
.card-close:hover{color:#fff;}
.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.card-ico{width:34px;height:34px;background:var(--cyan);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.card-name{font-size:15px;font-weight:700;color:#fff;}
.card-row{display:flex;gap:8px;font-size:11px;margin-bottom:5px;align-items:flex-start;}
.card-lbl{color:var(--cyan);font-weight:500;min-width:36px;flex-shrink:0;}
.card-val{color:#b0bec5;line-height:1.5;}
.card-actions{display:flex;gap:7px;margin-top:12px;}
.cbtn{
  flex:1;padding:9px 6px;border-radius:8px;border:none;
  font-family:'Noto Sans JP',sans-serif;font-size:11px;
  cursor:pointer;font-weight:500;transition:opacity .18s;
}
.cbtn:hover{opacity:.82;}
.cbtn.primary{background:var(--cyan);color:var(--navy);}
.cbtn.secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);}

/* ── PASSWORD SCREEN ── */
.pw-screen{
  position:fixed;inset:0;background:var(--navy);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;padding:20px;
}
.pw-screen.gone{display:none;}
.pw-box{
  background:rgba(255,255,255,.05);border:1px solid rgba(0,172,193,.4);
  border-radius:18px;padding:36px 32px;max-width:400px;width:100%;text-align:center;
}
.pw-box .pw-icon{font-size:44px;margin-bottom:14px;}
.pw-box h2{font-size:18px;font-weight:700;color:#fff;margin-bottom:8px;}
.pw-box p{font-size:12px;color:var(--gray);margin-bottom:22px;line-height:1.7;}
.pw-box input{
  width:100%;background:rgba(255,255,255,.07);
  border:1px solid rgba(0,172,193,.4);border-radius:9px;
  padding:11px 16px;color:#fff;font-size:16px;
  letter-spacing:.2em;font-family:'Inter',sans-serif;
  outline:none;margin-bottom:10px;text-align:center;
}
.pw-box input:focus{border-color:var(--cyan);}
.pw-box input::placeholder{letter-spacing:normal;font-size:13px;}
.pw-btn{
  width:100%;padding:12px;background:var(--cyan);border:none;
  border-radius:9px;color:var(--navy);font-weight:700;font-size:15px;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:opacity .2s;margin-bottom:8px;
}
.pw-btn:hover{opacity:.85;}
.pw-err{color:#ef5350;font-size:12px;min-height:18px;}
.pw-attempts{color:var(--gray);font-size:10px;margin-top:4px;}

/* ── Leaflet カスタム ── */
.leaflet-tooltip-custom{
  background:rgba(10,20,35,0.95)!important;border:1px solid var(--cyan)!important;
  color:#cfd8dc!important;font-family:'Noto Sans JP',sans-serif!important;
  font-size:12px!important;border-radius:8px!important;
  padding:7px 10px!important;box-shadow:0 4px 16px rgba(0,172,193,.2)!important;
  line-height:1.6!important;
}
.leaflet-tooltip-custom::before{border-top-color:var(--cyan)!important;}
.leaflet-control-zoom{border:1px solid rgba(0,172,193,.3)!important;}
.leaflet-control-zoom a{background:rgba(10,20,35,.95)!important;color:var(--cyan)!important;border-bottom:1px solid rgba(0,172,193,.2)!important;}
.leaflet-control-zoom a:hover{background:rgba(0,172,193,.15)!important;}

/* ── MOBILE ── */
@media(max-width:768px){
  header{padding:0 12px;height:48px;gap:8px;}
  .htitle{font-size:13px;} .hsub{display:none;}
  .hbadge{font-size:10px;padding:2px 8px;}
  #menuBtn{display:flex!important;}
  .layout{flex-direction:column;padding-top:48px;}
  .sidebar{
    position:fixed;top:48px;left:0;right:0;bottom:0;
    width:100%;z-index:950;
    transform:translateX(-100%);transition:transform .25s ease;
  }
  .sidebar.open{transform:translateX(0);}
  .map-wrap{width:100%;height:calc(100vh - 48px);}
  .hazard-panel{
    top:auto;bottom:0;left:0;right:0;
    border-radius:0;border-left:none;border-right:none;border-bottom:none;
    min-width:unset;padding:8px 10px 12px;
    display:flex;flex-direction:row;align-items:center;
    gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .hazard-panel::-webkit-scrollbar{display:none;}
  .hazard-panel h3{display:none;}
  .hbtn{flex-shrink:0;white-space:nowrap;padding:6px 12px;font-size:11px;margin-bottom:0;}
  .info-card{
    bottom:56px;left:8px;right:8px;
    transform:none;min-width:unset;max-width:unset;
    border-radius:14px;padding:14px 14px 10px;
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  #sbOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:940;top:48px;}
  #sbOverlay.show{display:block;}
  #sbCloseBtn{display:block!important;}
}
@media(min-width:769px){
  #menuBtn{display:none!important;}
  #sbOverlay{display:none!important;}
}
</style>
</head>
<body>

<!-- パスワード画面 -->
<div class="pw-screen" id="pwScreen">
  <div class="pw-box">
    <div class="pw-icon">🔐</div>
    <h2>簡易局マップ</h2>
    <p>このシステムは社内専用です。<br>パスワードを入力してください。</p>
    <input type="password" id="pwInput" placeholder="パスワードを入力" autocomplete="off"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button class="pw-btn" onclick="checkPw()">ログイン</button>
    <div class="pw-err" id="pwErr"></div>
    <div class="pw-attempts" id="pwAttempts"></div>
  </div>
</div>

<header>
  <button id="menuBtn" onclick="toggleSidebar()">☰</button>
  <div class="logo">📍</div>
  <div><div class="htitle">簡易局マップ</div><div class="hsub">防災情報システム</div></div>
  <span class="hbadge" id="badgeCount">248 局</span>
</header>

<div class="layout">
  <div id="sbOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-search">
      <input type="text" id="searchInput" placeholder="🔍 名前・住所・郵便番号で検索" oninput="filterList(this.value)">
      <button id="sbCloseBtn" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="sb-list" id="sbList"></div>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>

    <!-- ハザードマップ -->
    <div class="hazard-panel">
      <h3>🛡 ハザードマップ</h3>
      <button class="hbtn" id="hbtn-tsunami"   onclick="toggleHazard('tsunami')"  ><span>🌊</span>津波</button>
      <button class="hbtn" id="hbtn-flood"     onclick="toggleHazard('flood')"    ><span>🌧</span>洪水・河川氾濫</button>
      <button class="hbtn" id="hbtn-landslide" onclick="toggleHazard('landslide')"><span>⛰</span>土砂災害</button>
      <button class="hbtn" id="hbtn-volcano"   onclick="toggleHazard('volcano')"  ><span>🌋</span>火山 <span style="font-size:9px;opacity:.7;margin-left:auto">外部↗</span></button>
      <button class="hbtn" id="hbtn-none"      onclick="toggleHazard('none')"     ><span>🗺</span>標準に戻す</button>
    </div>

    <!-- 情報カード -->
    <div class="info-card" id="infoCard">
      <button class="card-close" onclick="closeCard()">✕</button>
      <div class="card-hd">
        <div class="card-ico">📮</div>
        <div class="card-name" id="cName"></div>
      </div>
      <div class="card-row"><span class="card-lbl">住所</span><span class="card-val" id="cAddr"></span></div>
      <div class="card-row"><span class="card-lbl">郵便</span><span class="card-val" id="cPost"></span></div>
      <div class="card-row"><span class="card-lbl">電話</span><span class="card-val" id="cPhone"></span></div>
      <div class="card-actions">
        <button class="cbtn primary"   onclick="openOSM()">🗺 地図で開く</button>
        <button class="cbtn secondary" onclick="closeCard()">✕ 閉じる</button>
      </div>
    </div>
  </div>
</div>

// ════════════════════════════════════════
//  ハザードマップタイル
// ════════════════════════════════════════
const HAZARD={
  tsunami:  ['https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png'],
  flood:    ['https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png'],
  landslide:['https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png',
             'https://disaportaldata.gsi.go.jp/raster/05_kyukeisyatikeikaikuiki/{z}/{x}/{y}.png',
             'https://disaportaldata.gsi.go.jp/raster/05_jisuberikeikaikuiki/{z}/{x}/{y}.png'],
};

// ════════════════════════════════════════
//  パスワード認証
// ════════════════════════════════════════
(function(){
  const PW_HASH  = 'd1af0e46820bf4aeca7eb38afaeb260742b1c16a26130b0696cb577014320145';   // 管理者セットアップツールで設定
  const SESSION  = 'kmapAuth';
  const MAX_TRIES = 10;
  let tries = parseInt(sessionStorage.getItem('kmapTries')||'0');

  if(sessionStorage.getItem(SESSION)==='ok'){
    document.getElementById('pwScreen').classList.add('gone');
    return;
  }
  if(tries>=MAX_TRIES){
    document.getElementById('pwErr').textContent='試行回数超過。ブラウザを再起動してください。';
    document.getElementById('pwInput').disabled=true;
    document.querySelector('.pw-btn').disabled=true;
  }

  window.checkPw=async function(){
    if(tries>=MAX_TRIES)return;
    const val=document.getElementById('pwInput').value;
    const hash=await sha256(val);
    if(hash===PW_HASH){
      sessionStorage.setItem(SESSION,'ok');
      sessionStorage.removeItem('kmapTries');
      document.getElementById('pwScreen').classList.add('gone');
    } else {
      tries++;
      sessionStorage.setItem('kmapTries',tries);
      document.getElementById('pwErr').textContent='パスワードが違います。';
      document.getElementById('pwInput').value='';
      const rem=MAX_TRIES-tries;
      document.getElementById('pwAttempts').textContent=rem>0?'残り'+rem+'回':'試行回数超過';
      if(tries>=MAX_TRIES){
        document.getElementById('pwInput').disabled=true;
        document.querySelector('.pw-btn').disabled=true;
      }
    }
  };

  async function sha256(str){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
})();

// ════════════════════════════════════════
//  地図・マーカー
// ════════════════════════════════════════
let map, markerLayer, hazardLayers=[];

window.addEventListener('load',()=>{
  map=L.map('map',{zoomControl:true}).setView([43.5,143.0],7);

  // Carto Dark Matter（無料・APIキー不要）
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains:'abcd',maxZoom:19
  }).addTo(map);

  markerLayer=L.layerGroup().addTo(map);
  buildList(RECORDS);
  placeMarkers();
});

function placeMarkers(){
  let placed=0;
  RECORDS.forEach(r=>{
    if(!COORDS_CACHE||!COORDS_CACHE[r.name])return;
    const[lat,lng]=COORDS_CACHE[r.name];
    r._pos={lat,lng};
    addMarker(r);
    placed++;
  });
  document.getElementById('badgeCount').textContent=placed+' 局';
}

const icoDefault=L.divIcon({
  className:'',
  html:'<div style="width:13px;height:13px;background:#00acc1;border:2px solid #fff;border-radius:50%;box-shadow:0 0 6px rgba(0,172,193,.8)"></div>',
  iconSize:[13,13],iconAnchor:[6,6]
});
const icoActive=L.divIcon({
  className:'',
  html:'<div style="width:20px;height:20px;background:#ff7043;border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(255,112,67,.9)"></div>',
  iconSize:[20,20],iconAnchor:[10,10]
});

function addMarker(r){
  const m=L.marker([r._pos.lat,r._pos.lng],{icon:icoDefault}).addTo(markerLayer)
    .bindTooltip(
      '<b>📮 '+r.name+'</b><br>'+r.address+'<br><span style="color:#00acc1">'+(r.phone||'電話番号なし')+'</span>',
      {direction:'top',offset:[0,-8],className:'leaflet-tooltip-custom'}
    );
  m.on('click',()=>{
    resetActive();
    m.setIcon(icoActive); r._active=true; currentRec=r;
    showCard(r);
    document.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('active'));
    if(r._sbEl){r._sbEl.classList.add('active');r._sbEl.scrollIntoView({block:'nearest'});}
  });
  r._marker=m;
}

function resetActive(){
  RECORDS.forEach(r=>{if(r._active&&r._marker){r._marker.setIcon(icoDefault);r._active=false;}});
}

let currentRec=null;

function showCard(r){
  document.getElementById('cName').textContent=r.name;
  document.getElementById('cAddr').textContent=r.address;
  document.getElementById('cPost').textContent='〒'+r.postal;
  document.getElementById('cPhone').textContent=r.phone||'登録なし';
  const c=document.getElementById('infoCard');
  c.classList.remove('show');void c.offsetWidth;c.classList.add('show');
}

function closeCard(){
  document.getElementById('infoCard').classList.remove('show');
  resetActive(); currentRec=null;
}

function openOSM(){
  if(!currentRec||!currentRec._pos)return;
  window.open('https://www.openstreetmap.org/?mlat='+currentRec._pos.lat+'&mlon='+currentRec._pos.lng+'#map=16/'+currentRec._pos.lat+'/'+currentRec._pos.lng,'_blank');
}

// ════════════════════════════════════════
//  サイドバー
// ════════════════════════════════════════
function buildList(list){
  const el=document.getElementById('sbList');
  el.innerHTML='';
  if(!list.length){el.innerHTML='<div class="sb-empty">該当なし</div>';return;}
  list.forEach(r=>{
    const d=document.createElement('div');
    d.className='sb-item'+(r===currentRec?' active':'');
    d.innerHTML='<div class="iname">'+r.name+'</div><div class="iaddr">'+r.address+'</div>';
    d.onclick=()=>{
      if(r._marker){map.setView(r._marker.getLatLng(),14);r._marker.fire('click');}
      closeSidebarMobile();
    };
    r._sbEl=d; el.appendChild(d);
  });
}

function filterList(q){
  buildList(RECORDS.filter(r=>r.name.includes(q)||r.address.includes(q)||r.postal.includes(q)));
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sbOverlay');
  const isOpen=sb.classList.contains('open');
  sb.classList.toggle('open',!isOpen);
  ov.classList.toggle('show',!isOpen);
}

function closeSidebarMobile(){
  if(window.innerWidth<=768){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sbOverlay').classList.remove('show');
  }
}

// ════════════════════════════════════════
//  ハザードマップ
// ════════════════════════════════════════
function toggleHazard(key){
  document.querySelectorAll('.hbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('hbtn-'+key).classList.add('active');
  hazardLayers.forEach(l=>map.removeLayer(l));
  hazardLayers=[];

  if(key==='none') return;

  if(key==='volcano'){
    document.getElementById('hbtn-volcano').classList.remove('active');
    if(confirm('火山ハザードマップは国土地理院の外部サイトで確認できます。\n開きますか？')){
      window.open('https://disaportal.gsi.go.jp/maps/index.html?code=7','_blank');
    }
    return;
  }

  (HAZARD[key]||[]).forEach(url=>{
    const layer=L.tileLayer(
      url.replace('{z}','{z}').replace('{x}','{x}').replace('{y}','{y}'),
      {opacity:.7,maxZoom:18}
    );
    layer.addTo(map);
    hazardLayers.push(layer);
  });
}
</script>
